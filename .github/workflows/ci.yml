name: CI

# Chrome-free gate battery: the same curated suites the local loop runs
# before every commit. Live-Chrome harnesses (fixtures/run_*_live.py,
# test_suite.py) stay local/manual because they need a real browser
# profile on the machine under test.
on:
  pull_request:
  push:
    branches: [main, "hyper/**"]
  workflow_dispatch:

jobs:
  chrome-free:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (dev + fast codec + mcp extras)
        run: python -m pip install -e ".[dev,fast,mcp]"
      - name: Chrome-free gates
        shell: bash
        run: >
          python -m pytest
          test_cycle*.py test_phase*.py
          test_fault_corpus.py test_benchmark_harness.py
          test_docs_coherence.py test_evidence_and_isolation.py
          -q
